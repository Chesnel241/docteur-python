<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Apprends Python de zéro avec le Docteur Python : explications terre à terre, quiz, exercices corrigés automatiquement, diagnostic des erreurs en français et un labo pour exécuter ton code dans le navigateur.">
<meta name="theme-color" content="#2E66D6">
<meta property="og:title" content="Docteur Python">
<meta property="og:description" content="Apprends Python de zéro, une consultation à la fois.">
<meta property="og:type" content="website">

<link rel="manifest" href="/manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Docteur Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>/* Concept : un cabinet lumineux. Cartes larges, tuiles d'icônes teintées, couleurs du serpent Python (bleu, jaune) + couleurs d'état. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F7F9FD; --ink:#141C33; --ink-2:#47526B; --muted:#7A8499; --line:#E1E6F0; --line-2:#EDF0F6;
  --blue:#2E66D6; --blue-ink:#1D4CA8; --blue-soft:#E6EEFC;
  --yellow:#F2B92E; --yellow-ink:#7A5800; --yellow-soft:#FFF4D4;
  --green:#18905F; --green-ink:#0F6B46; --green-soft:#E0F4EA;
  --red:#D63C51; --red-ink:#A92438; --red-soft:#FCE6E9;
  --orange:#E5801F; --orange-ink:#A35407; --orange-soft:#FDECD9;
  --violet:#6E52D2; --violet-ink:#4F35AE; --violet-soft:#ECE7FC;
  --rose:#D2427A; --rose-ink:#A1255A; --rose-soft:#FBE4EE;
  --teal:#0F8F94; --teal-ink:#0A6A6E; --teal-soft:#DDF3F3;
  --code-bg:#F4F7FC; --code-line:#E6EBF5;
  --tk-kw:#7B3CC4; --tk-str:#16804F; --tk-num:#BF560D; --tk-com:#8790A6; --tk-fn:#2558C4; --tk-bi:#B42D69; --tk-const:#C2410C; --tk-op:#56617A;
  --shadow:0 1px 2px rgba(20,28,51,.05), 0 6px 20px -8px rgba(20,28,51,.10);
  --shadow-lg:0 2px 4px rgba(20,28,51,.05), 0 18px 40px -16px rgba(20,28,51,.18);
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --nav-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#161D31; --surface-2:#1B2339; --ink:#E9EDF7; --ink-2:#B3BBD0; --muted:#8891A9; --line:#29324C; --line-2:#222A42;
  --blue:#6B97FF; --blue-ink:#9DBBFF; --blue-soft:#1C2A4D;
  --yellow:#F5C451; --yellow-ink:#FFD980; --yellow-soft:#3A3013;
  --green:#3CC98D; --green-ink:#7BE2B4; --green-soft:#133A2B;
  --red:#FF6B7F; --red-ink:#FF9AA8; --red-soft:#43202A;
  --orange:#FFA155; --orange-ink:#FFC28F; --orange-soft:#422A14;
  --violet:#A48BFF; --violet-ink:#C5B6FF; --violet-soft:#2A2350;
  --rose:#FF7BAE; --rose-ink:#FFA9CA; --rose-soft:#43203A;
  --teal:#3FD0D4; --teal-ink:#86E6E8; --teal-soft:#123C40;
  --code-bg:#121A2D; --code-line:#232C46;
  --tk-kw:#C9A2FF; --tk-str:#73D9A6; --tk-num:#FFB67A; --tk-com:#6F7A95; --tk-fn:#8FB2FF; --tk-bi:#FF92BF; --tk-const:#FFA36B; --tk-op:#A8B1C8;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3), 0 20px 44px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#161D31; --surface-2:#1B2339; --ink:#E9EDF7; --ink-2:#B3BBD0; --muted:#8891A9; --line:#29324C; --line-2:#222A42;
  --blue:#6B97FF; --blue-ink:#9DBBFF; --blue-soft:#1C2A4D;
  --yellow:#F5C451; --yellow-ink:#FFD980; --yellow-soft:#3A3013;
  --green:#3CC98D; --green-ink:#7BE2B4; --green-soft:#133A2B;
  --red:#FF6B7F; --red-ink:#FF9AA8; --red-soft:#43202A;
  --orange:#FFA155; --orange-ink:#FFC28F; --orange-soft:#422A14;
  --violet:#A48BFF; --violet-ink:#C5B6FF; --violet-soft:#2A2350;
  --rose:#FF7BAE; --rose-ink:#FFA9CA; --rose-soft:#43203A;
  --teal:#3FD0D4; --teal-ink:#86E6E8; --teal-soft:#123C40;
  --code-bg:#121A2D; --code-line:#232C46;
  --tk-kw:#C9A2FF; --tk-str:#73D9A6; --tk-num:#FFB67A; --tk-com:#6F7A95; --tk-fn:#8FB2FF; --tk-bi:#FF92BF; --tk-const:#FFA36B; --tk-op:#A8B1C8;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3), 0 20px 44px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
b,strong{font-weight:750}
code{font-family:var(--f-mono);font-size:.88em;background:var(--code-bg);border:1px solid var(--code-line);padding:.08em .38em;border-radius:6px;white-space:nowrap}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.lucide{width:1em;height:1em;stroke-width:2.1;flex:none}

/* ---------- Header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding-inline:16px;height:66px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);background:none;border:0;padding:0}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:1.28rem;letter-spacing:-.02em;line-height:1}
.brand-name span{color:var(--blue)}
.nav{display:flex;gap:6px;margin-left:18px}
.nav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:10px 15px;border-radius:12px;font-weight:700;color:var(--ink-2);font-size:.98rem}
.nav button svg{font-size:1.15rem}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink)}
.top .spacer{flex:1}
.engine{display:flex;align-items:center;gap:8px;padding:7px 13px 7px 11px;border-radius:999px;font-size:.84rem;font-weight:700;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.engine .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.engine.loading .dot{background:var(--yellow);animation:pulse 1.2s ease-in-out infinite}
.engine.ready .dot{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.engine.fallback .dot{background:var(--violet)}
.engine.error .dot{background:var(--red)}
.engine .bar{width:54px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.engine .bar i{display:block;height:100%;background:var(--yellow);border-radius:9px;transition:width .4s}
@keyframes pulse{50%{opacity:.35}}

/* Bottom nav (mobile) */
.bnav{display:none}
@media (max-width:760px){
  .nav{display:none}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:7px 4px;border-radius:14px;font-weight:700;font-size:.78rem;color:var(--muted)}
  .bnav button svg{font-size:1.45rem}
  .bnav button[aria-current="page"]{color:var(--blue-ink);background:var(--blue-soft)}
  main{padding-bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}
  .top-in{height:58px}
  .engine .lbl-long{display:none}
}

/* ---------- Layout ---------- */
main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:26px 60px}
.view[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.85rem,4.4vw,2.7rem);font-weight:800}
h2{font-size:clamp(1.35rem,2.8vw,1.75rem);font-weight:800}
h3{font-size:1.15rem;font-weight:750}
.eyebrow{font-size:.76rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:18px}

/* Tints */
.t-blue{--c:var(--blue);--c-ink:var(--blue-ink);--c-soft:var(--blue-soft)}
.t-yellow{--c:var(--yellow);--c-ink:var(--yellow-ink);--c-soft:var(--yellow-soft)}
.t-green{--c:var(--green);--c-ink:var(--green-ink);--c-soft:var(--green-soft)}
.t-red{--c:var(--red);--c-ink:var(--red-ink);--c-soft:var(--red-soft)}
.t-orange{--c:var(--orange);--c-ink:var(--orange-ink);--c-soft:var(--orange-soft)}
.t-violet{--c:var(--violet);--c-ink:var(--violet-ink);--c-soft:var(--violet-soft)}
.t-teal{--c:var(--teal);--c-ink:var(--teal-ink);--c-soft:var(--teal-soft)}
.t-rose{--c:var(--rose);--c-ink:var(--rose-ink);--c-soft:var(--rose-soft)}
.tile{display:grid;place-items:center;width:56px;height:56px;border-radius:17px;background:var(--c-soft);color:var(--c);font-size:1.75rem;flex:none}
.tile.lg{width:76px;height:76px;border-radius:22px;font-size:2.3rem}
.tile.sm{width:42px;height:42px;border-radius:13px;font-size:1.3rem}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 19px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:750;font-size:.97rem;color:var(--ink);transition:transform .12s, background .15s, box-shadow .15s;white-space:nowrap;text-decoration:none}
.btn svg{font-size:1.15rem}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 6px 16px -8px var(--blue)}
.btn.primary:hover{background:var(--blue-ink)}
.btn.run{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 6px 16px -8px var(--green)}
.btn.run:hover{filter:brightness(.95)}
.btn.stop{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.btn.soft{background:var(--c-soft,var(--blue-soft));border-color:transparent;color:var(--c-ink,var(--blue-ink))}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 13px;font-size:.9rem;border-radius:11px}
.btn.lg{min-height:54px;padding:0 24px;font-size:1.05rem;border-radius:15px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary,:root:not([data-theme="light"]) .btn.run{color:#0B1020}}
:root[data-theme="dark"] .btn.primary,:root[data-theme="dark"] .btn.run{color:#0B1020}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:.8rem;font-weight:750;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill svg{font-size:.95rem}
.pill.done{background:var(--green-soft);color:var(--green-ink);border-color:transparent}
.pill.doing{background:var(--yellow-soft);color:var(--yellow-ink);border-color:transparent}
.pill.tint{background:var(--c-soft);color:var(--c-ink);border-color:transparent}

/* ---------- Home ---------- */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:stretch}
.hero-main{padding:30px;display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero-main p{margin:0;color:var(--ink-2);font-size:1.08rem;max-width:52ch}
.hero-main .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.hero-deco{position:absolute;right:-30px;bottom:-40px;width:210px;height:210px;opacity:.9;pointer-events:none}
.hero-next{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-2);max-width:440px;position:relative;z-index:1}
.hero-next .txt{min-width:0}
.hero-next .txt b{display:block;font-size:1.02rem;line-height:1.3}
.hero-next .txt span{font-size:.86rem;color:var(--muted)}
.stats{padding:24px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:var(--f-display);font-size:2rem;font-weight:800;line-height:1}
.ring .val span{font-size:.74rem;color:var(--muted);font-weight:700;display:block;margin-top:2px}
.stat-list{display:grid;gap:10px}
.stat{display:flex;align-items:center;gap:12px}
.stat .tile{width:44px;height:44px;border-radius:13px;font-size:1.3rem}
.stat b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.84rem;color:var(--muted);font-weight:600}
.method{margin-top:22px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mstep{padding:18px;display:flex;gap:14px;align-items:flex-start}
.mstep h3{font-size:1.02rem;margin-bottom:3px}
.mstep p{margin:0;font-size:.9rem;color:var(--ink-2);line-height:1.5}
.mstep .num{font-family:var(--f-display);font-weight:800;color:var(--c);font-size:.8rem;letter-spacing:.06em}
.level{margin-top:40px}
.level-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.level-head .txt{flex:1;min-width:200px}
.level-head p{margin:2px 0 0;color:var(--muted);font-weight:600}
.lvl-progress{display:flex;align-items:center;gap:10px;font-weight:750;font-size:.88rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.pbar{height:10px;border-radius:99px;background:var(--line-2);overflow:hidden;width:140px}
.pbar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--blue));transition:width .5s}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.lcard{display:flex;flex-direction:column;gap:12px;padding:18px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s, border-color .15s;position:relative;min-width:0}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.lcard .head{display:flex;gap:14px;align-items:center}
.lcard .num{font-size:.75rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--c-ink)}
.lcard h3{font-size:1.12rem;margin-top:2px}
.lcard p{margin:0;color:var(--ink-2);font-size:.92rem;line-height:1.45}
.lcard .foot{display:flex;gap:8px;align-items:center;margin-top:auto;flex-wrap:wrap}
.lcard.is-done{border-color:color-mix(in srgb,var(--green) 35%,var(--line))}
.lcard .check{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:1rem}
@media (max-width:980px){.hero{grid-template-columns:1fr}.method{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.method{grid-template-columns:1fr}.stats{grid-template-columns:1fr;justify-items:center}.stat-list{width:100%}.hero-main{padding:22px}.hero-deco{width:150px;height:150px;opacity:.5}}

/* ---------- Lesson ---------- */
.lesson-wrap{max-width:860px;margin:0 auto}
.backbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.lhead{display:flex;gap:20px;align-items:center;margin-bottom:20px}
.lhead .txt{min-width:0}
.lhead p{margin:6px 0 0;color:var(--ink-2);font-size:1.1rem}
.stepper{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:20;display:flex;gap:6px;padding:8px;margin:0 0 22px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:12px;font-weight:750;font-size:.9rem;color:var(--ink-2);white-space:nowrap}
.stepper button .ic{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--surface-2);font-size:.9rem}
.stepper button.ok{border-color:transparent;background:var(--green-soft);color:var(--green-ink)}
.stepper button.ok .ic{background:var(--green);color:#fff}
@media (max-width:760px){.stepper{top:calc(env(safe-area-inset-top,0px) + 58px)}.stepper button .lb{display:none}.stepper button.cur .lb{display:inline}}
.goals{padding:20px 22px;display:flex;gap:16px;align-items:flex-start}
.goals ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:7px}
.goals li{display:flex;gap:10px;align-items:flex-start}
.goals li svg{color:var(--green);margin-top:5px}
.section-title{display:flex;align-items:center;gap:12px;margin:38px 0 14px}
.section-title .tile{width:44px;height:44px;border-radius:13px;font-size:1.3rem}
.prose{font-size:1.05rem;color:var(--ink);max-width:68ch}
.prose p{margin:0}
.blk-h{font-size:1.3rem;margin:14px 0 -4px}
.callout{display:flex;gap:15px;padding:18px 20px;border-radius:var(--r-md);background:var(--c-soft);border:1px solid color-mix(in srgb,var(--c) 22%,transparent)}
.callout .tile{width:44px;height:44px;border-radius:13px;font-size:1.3rem;background:var(--surface);}
.callout .lbl{font-weight:800;color:var(--c-ink);font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.callout h4{margin:0 0 4px;font-family:var(--f-display);font-size:1.12rem}
.callout p{margin:0;color:var(--ink)}
.codebox{border-radius:var(--r-md);border:1px solid var(--line);background:var(--code-bg);overflow:hidden}
.codebox pre{margin:0;padding:16px 18px;font-family:var(--f-mono);font-size:.92rem;line-height:1.65;overflow-x:auto;tab-size:4}
.codebox .bar{display:flex;gap:8px;align-items:center;padding:9px 10px;border-top:1px solid var(--code-line);background:var(--surface);flex-wrap:wrap}
.codebox .bar .lang{margin-right:auto;font-size:.78rem;font-weight:800;color:var(--muted);letter-spacing:.06em;padding-left:6px;display:flex;align-items:center;gap:6px}
.codebox .out{border-top:1px solid var(--code-line)}
.note{font-size:.95rem;color:var(--ink-2);margin:-6px 4px 0}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:11px 15px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);font-weight:800}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}

/* Visuals */
.visual{padding:20px;border-radius:var(--r-md);background:var(--surface);border:1px dashed color-mix(in srgb,var(--blue) 35%,var(--line));overflow-x:auto}
.visual .vlbl{display:flex;align-items:center;gap:7px;font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-ink);margin-bottom:14px}
.vboxes{display:flex;flex-wrap:wrap;gap:16px}
.vbox{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.vbox .name{font-family:var(--f-mono);font-weight:700;font-size:.85rem;background:var(--yellow-soft);color:var(--yellow-ink);padding:3px 10px;border-radius:8px 8px 8px 2px}
.vbox .val{font-family:var(--f-mono);font-weight:600;font-size:1.02rem;padding:12px 18px;border:2px solid var(--blue);border-radius:12px;background:var(--blue-soft);color:var(--ink);min-width:70px;text-align:center;max-width:100%;overflow-wrap:anywhere}
.vbox .ty{font-size:.74rem;font-weight:800;color:var(--muted);letter-spacing:.05em}
.vbox.changed .val{border-color:var(--orange);background:var(--orange-soft);animation:pop .4s}
@keyframes pop{40%{transform:scale(1.06)}}
.cells{display:flex;gap:0;align-items:stretch;flex-wrap:nowrap;width:max-content}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.cell .idx{font-family:var(--f-mono);font-size:.8rem;font-weight:700;color:var(--blue-ink)}
.cell .idx.neg{color:var(--rose-ink)}
.cell .v{font-family:var(--f-mono);font-weight:600;padding:12px 16px;border:2px solid var(--green);border-right-width:0;background:var(--green-soft);min-width:64px;text-align:center}
.cell:first-child .v{border-radius:12px 0 0 12px}
.cell:last-child .v{border-right-width:2px;border-radius:0 12px 12px 0}
.vrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dict{display:grid;grid-template-columns:auto auto 1fr;gap:8px 12px;align-items:center;width:max-content;max-width:100%}
.dict .k{font-family:var(--f-mono);font-weight:700;padding:8px 13px;border-radius:10px;background:var(--violet-soft);color:var(--violet-ink)}
.dict .arrow{color:var(--muted)}
.dict .v{font-family:var(--f-mono);font-weight:600;padding:8px 13px;border-radius:10px;border:2px solid var(--blue);background:var(--blue-soft)}
.flow{display:grid;gap:0;counter-reset:fl}
.flow .st{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:14px}
.flow .st:last-child{padding-bottom:0}
.flow .st::before{counter-increment:fl;content:counter(fl);flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:.9rem;z-index:1}
.flow .st::after{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.flow .st:last-child::after{display:none}
.flow .st span{padding-top:4px;font-weight:600}
.branch{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:560px}
.branch .q{grid-column:1/-1;justify-self:center;padding:12px 20px;border-radius:14px;background:var(--yellow-soft);color:var(--yellow-ink);font-family:var(--f-mono);font-weight:700;border:2px solid var(--yellow)}
.branch .path{padding:14px;border-radius:14px;border:2px solid var(--c);background:var(--c-soft);text-align:center;font-weight:650}
.branch .path b{display:block;color:var(--c-ink);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.type{padding:14px;border-radius:14px;background:var(--c-soft);display:flex;flex-direction:column;gap:4px}
.type b{font-family:var(--f-mono);font-size:1.05rem;color:var(--c-ink)}
.type code{background:var(--surface);align-self:flex-start}
.type span{font-size:.86rem;color:var(--ink-2)}
.machine{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.machine .io{font-family:var(--f-mono);font-weight:700;padding:10px 16px;border-radius:12px;background:var(--yellow-soft);color:var(--yellow-ink)}
.machine .box{padding:16px 22px;border-radius:16px;background:var(--violet);color:#fff;font-family:var(--f-mono);font-weight:700;display:flex;align-items:center;gap:10px}
.machine .arr{color:var(--muted);font-size:1.4rem}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.compare .side{min-width:0}
.compare .side .lbl{font-weight:800;font-size:.85rem;margin:0 0 7px 4px;color:var(--ink-2)}
@media (max-width:640px){.compare{grid-template-columns:1fr}.branch{grid-template-columns:1fr}}
.objs{display:flex;gap:14px;flex-wrap:wrap}
.obj{border:2px solid var(--violet);border-radius:14px;overflow:hidden;min-width:200px;background:var(--surface)}
.obj .on{background:var(--violet-soft);color:var(--violet-ink);padding:8px 14px;font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.obj .at{display:flex;justify-content:space-between;gap:16px;padding:7px 14px;font-family:var(--f-mono);font-size:.88rem;border-top:1px solid var(--line-2)}
.obj .at span:first-child{color:var(--muted)}
.tbk{font-family:var(--f-mono);font-size:.88rem;line-height:1.7;display:grid;gap:8px}
.tbk .ln{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.tbk .ln pre{margin:0;padding:6px 10px;border-radius:8px;background:var(--code-bg);flex:1;min-width:220px;overflow-x:auto}
.tbk .tag{font-family:var(--f-body);font-size:.78rem;font-weight:800;padding:5px 10px;border-radius:8px;background:var(--c-soft);color:var(--c-ink);white-space:nowrap;align-self:center}

/* Predict & quiz */
.qcard{padding:22px}
.qcard .qhead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.qcard .q{font-weight:700;font-size:1.08rem}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:650;font-size:1rem;transition:border-color .15s, background .15s}
.opt .k{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-2);font-weight:800;font-size:.88rem;flex:none;color:var(--ink-2)}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt code{white-space:normal}
.feedback{margin-top:14px;padding:14px 16px;border-radius:14px;display:flex;gap:12px;align-items:flex-start;background:var(--c-soft)}
.feedback .tile{width:36px;height:36px;border-radius:11px;font-size:1.1rem;background:var(--c);color:#fff}
.feedback b.t{display:block;color:var(--c-ink)}
.quiz-score{display:flex;align-items:center;gap:10px;font-weight:750}

/* Exercise (ordonnance) */
.rx{border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.rx-head{display:flex;gap:16px;align-items:center;padding:18px 20px;background:var(--yellow-soft);border-bottom:2px dashed color-mix(in srgb,var(--yellow) 60%,transparent)}
.rx-head .tile{background:var(--surface);color:var(--yellow-ink)}
.rx-head .lbl{font-size:.76rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--yellow-ink)}
.rx-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.rx-task{font-size:1.04rem}
.rx-actions{display:flex;gap:10px;flex-wrap:wrap}
.hint{display:flex;gap:12px;padding:13px 15px;border-radius:13px;background:var(--violet-soft);color:var(--ink)}
.hint svg{color:var(--violet);margin-top:4px;flex:none}
.verdict{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:15px;background:var(--c-soft);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.verdict .tile{background:var(--c);color:#fff}
.verdict b{display:block;font-family:var(--f-display);font-size:1.15rem;color:var(--c-ink)}
.verdict p{margin:2px 0 0}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}

.recap{padding:24px}
.recap ul{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.recap li{display:flex;gap:12px;align-items:flex-start;font-size:1.02rem}
.recap li .tile{width:30px;height:30px;border-radius:9px;font-size:.95rem}
.navnext{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}

/* ---------- Editor ---------- */
.editor{position:relative;display:flex;border:1px solid var(--line);border-radius:var(--r-md);background:var(--code-bg);overflow:hidden;min-height:140px}
.editor:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.ed-gutter{flex:none;width:46px;overflow:hidden;position:relative;background:color-mix(in srgb,var(--code-bg) 70%,var(--line-2));border-right:1px solid var(--code-line)}
.ed-gutter-in{position:absolute;top:0;left:0;right:0;padding-top:14px;font-family:var(--f-mono);font-size:15px;line-height:1.6;color:var(--muted);text-align:right;padding-right:10px}
.ed-gutter-in div{height:1.6em}
.ed-gutter-in div.err{color:var(--red);font-weight:800}
.ed-gutter-in div.cur{color:var(--orange-ink);font-weight:800}
.ed-area{position:relative;flex:1;min-width:0;overflow:hidden}
.ed-layer{position:absolute;top:0;left:0;will-change:transform}
.ed-hl,.ed-input{font-family:var(--f-mono);font-size:15px;line-height:1.6;tab-size:4;white-space:pre;letter-spacing:0;font-variant-ligatures:none;padding:14px 16px 14px 14px;margin:0;border:0}
.ed-hl{color:var(--ink);pointer-events:none;min-width:100%}
.ed-input{position:absolute;inset:0;width:100%;height:100%;resize:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--ink);outline:none;overflow:auto;overflow-wrap:normal;word-break:normal}
.ed-input::selection{background:color-mix(in srgb,var(--blue) 30%,transparent);-webkit-text-fill-color:transparent}
.ed-band{position:absolute;left:0;right:-2000px;height:1.6em;font-size:15px;pointer-events:none}
.ed-band.err{background:color-mix(in srgb,var(--red) 16%,transparent);border-left:3px solid var(--red)}
.ed-band.cur{background:color-mix(in srgb,var(--yellow) 30%,transparent);border-left:3px solid var(--orange)}
.ed-ro .ed-input{caret-color:transparent}
@media (max-width:700px){.ed-hl,.ed-input,.ed-gutter-in,.ed-band{font-size:16px}.ed-gutter{width:40px}}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 2px;scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:none;min-width:42px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:700;font-size:1rem;color:var(--ink)}
.keys button.wide{font-family:var(--f-body);font-size:.85rem}
.tk-kw{color:var(--tk-kw);font-weight:600}.tk-str{color:var(--tk-str)}.tk-num{color:var(--tk-num)}.tk-com{color:var(--tk-com);font-style:italic}.tk-fn{color:var(--tk-fn);font-weight:600}.tk-bi{color:var(--tk-bi)}.tk-const{color:var(--tk-const);font-weight:600}.tk-op{color:var(--tk-op)}.tk-self{color:var(--tk-kw);font-style:italic}

/* ---------- Console ---------- */
.console{font-family:var(--f-mono);font-size:.92rem;line-height:1.6;padding:14px 16px;min-height:64px;max-height:420px;overflow:auto;background:var(--surface);white-space:pre-wrap;overflow-wrap:anywhere}
.console .ph{color:var(--muted);font-family:var(--f-body);font-style:italic;white-space:normal}
.console .o-err{color:var(--red-ink)}
.console .o-sys{color:var(--muted);font-family:var(--f-body);font-size:.86rem;white-space:normal;display:flex;align-items:center;gap:6px}
.console .o-in{color:var(--blue-ink);font-weight:700}
.console .inrow{display:inline-flex;align-items:center;gap:8px;vertical-align:middle;max-width:100%}
.console .inrow input{font-family:var(--f-mono);font-size:16px;border:2px solid var(--blue);border-radius:9px;padding:4px 10px;background:var(--blue-soft);color:var(--ink);outline:none;width:min(260px,60vw)}
.console .inrow button{border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;padding:6px 12px;font-family:var(--f-body);font-size:.85rem}
.diag{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,var(--red) 30%,transparent);font-family:var(--f-body);white-space:normal}
.diag-head{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--red-soft)}
.diag-head .tile{width:38px;height:38px;border-radius:11px;font-size:1.15rem;background:var(--red);color:#fff}
.diag-head .lbl{font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--red-ink)}
.diag-head b{display:block;font-size:1.02rem;line-height:1.3}
.diag-body{padding:12px 14px;display:grid;gap:10px;background:var(--surface)}
.diag-body p{margin:0}
.diag-body ul{margin:0;padding-left:20px;display:grid;gap:4px}
.diag-body .rx-l{font-weight:800;color:var(--green-ink);display:flex;align-items:center;gap:6px}
.diag details summary{cursor:pointer;font-weight:700;color:var(--ink-2);font-size:.9rem}
.diag details pre{margin:8px 0 0;padding:10px 12px;background:var(--code-bg);border-radius:10px;font-family:var(--f-mono);font-size:.82rem;overflow-x:auto;white-space:pre}
.runbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2);font-size:.82rem;font-weight:750;color:var(--muted)}
.runbar .st{display:flex;align-items:center;gap:6px}
.runbar .st.ok{color:var(--green-ink)}.runbar .st.ko{color:var(--red-ink)}.runbar .st.run{color:var(--orange-ink)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Labo ---------- */
.lab-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lab-head p{margin:6px 0 0;color:var(--ink-2)}
.lab{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{overflow:hidden;display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-head h3{font-size:1.05rem;margin-right:auto;display:flex;align-items:center;gap:9px}
.panel-head h3 .tile{width:34px;height:34px;border-radius:10px;font-size:1.05rem}
.panel-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
.examples{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.88rem;color:var(--ink-2)}
.chip:hover{border-color:var(--blue);color:var(--blue-ink);background:var(--blue-soft)}
.chip svg{font-size:1rem;color:var(--c,var(--blue))}
.lab .console{max-height:none;min-height:260px;height:100%}
.repl{margin-top:18px}
.repl .console{max-height:300px;min-height:120px}
.repl-in{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line-2);background:var(--code-bg)}
.repl-in .pr{font-family:var(--f-mono);font-weight:800;color:var(--blue)}
.repl-in input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-family:var(--f-mono);font-size:16px;padding:6px 0}
.repl .r-cmd{color:var(--blue-ink);font-weight:700}
@media (max-width:980px){.lab{grid-template-columns:1fr}.lab .console{min-height:160px}}

/* Radiographie */
.xray{margin-top:18px;border-color:color-mix(in srgb,var(--orange) 40%,var(--line))}
.xray .panel-head{background:var(--orange-soft)}
.xray-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xray-ctl input[type=range]{flex:1;min-width:140px;accent-color:var(--orange)}
.xray-step{font-weight:800;font-variant-numeric:tabular-nums;min-width:110px}
.xray-info{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--surface-2);font-weight:650;flex-wrap:wrap}
.xray-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.frames{display:grid;gap:12px;align-content:start}
.frame{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.frame .fn{padding:8px 13px;background:var(--surface-2);font-weight:800;font-size:.88rem;display:flex;align-items:center;gap:8px}
.frame .fv{padding:13px;display:flex;flex-wrap:wrap;gap:12px}
.frame .empty{color:var(--muted);font-size:.9rem;font-style:italic}
.frame.active{border-color:var(--orange)}
.frame.active .fn{background:var(--orange-soft);color:var(--orange-ink)}
.xray-out .console{min-height:120px;max-height:260px;border:1px solid var(--line);border-radius:12px}
@media (max-width:760px){.xray-grid{grid-template-columns:1fr}}

/* ---------- Cheat sheet ---------- */
.cs-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);min-width:min(340px,100%);flex:0 1 380px}
.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:16px}
.search svg{color:var(--muted);font-size:1.2rem}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.cs{padding:0;overflow:hidden;display:flex;flex-direction:column}
.cs .h{display:flex;gap:12px;align-items:center;padding:16px 16px 12px}
.cs .h h3{font-size:1.08rem}
.cs pre{margin:0 14px;padding:13px 15px;border-radius:12px;background:var(--code-bg);border:1px solid var(--code-line);font-family:var(--f-mono);font-size:.86rem;line-height:1.6;overflow-x:auto}
.cs .f{display:flex;justify-content:flex-end;padding:10px 12px}
.err-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.errc{padding:18px;display:flex;flex-direction:column;gap:8px}
.errc .h{display:flex;gap:12px;align-items:center}
.errc h3{font-family:var(--f-mono);font-size:1rem;letter-spacing:0}
.errc p{margin:0;font-size:.94rem;color:var(--ink-2)}
.errc .fx{font-size:.92rem;padding:10px 12px;border-radius:11px;background:var(--green-soft);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;padding:13px 20px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:var(--shadow-lg);transition:all .3s;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:760px){.toast{bottom:calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}}
.engine-banner{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:16px;margin-bottom:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ed-hl span{font-weight:inherit!important;font-style:normal!important}

/* ---------- Aujourd'hui / Entraînement ---------- */
.today{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.todayc{display:flex;gap:14px;align-items:center;padding:18px;flex-wrap:wrap}
.todayc .txt{flex:1;min-width:180px}
.todayc h3{font-size:1.1rem;margin-top:2px}
.todayc p{margin:3px 0 0;color:var(--ink-2);font-size:.92rem;line-height:1.45}
.todayc p svg{vertical-align:-2px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on svg{color:#fff}
.pitem{overflow:hidden}
.pitem-head{display:flex;gap:14px;align-items:center;padding:16px 18px;background:var(--c-soft);flex-wrap:wrap}
.pitem-head .tile{background:var(--surface)}
.pitem-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.parsons{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.parsons{grid-template-columns:1fr}}
.plbl{display:flex;align-items:center;gap:7px;font-weight:800;font-size:.86rem;margin-bottom:8px;flex-wrap:wrap}
.plbl .muted{font-weight:600;font-size:.8rem}
.pprog,.ppool{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:10px;border-radius:14px;border:2px dashed var(--line);background:var(--surface-2)}
.pprog{border-color:color-mix(in srgb,var(--blue) 40%,var(--line));background:var(--blue-soft)}
.pline{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);min-height:46px;overflow-x:auto;transition:transform .12s}
.pline:hover{border-color:var(--blue)}
.pline:active{transform:scale(.98)}
.pline code{background:none;border:0;padding:0;white-space:pre;font-size:.92rem}
.pline .pn{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800;font-size:.78rem}
.pline.ok{border-color:var(--green);background:var(--green-soft)}
.pline.ok .pn{background:var(--green)}
.pline.ko{border-color:var(--red);background:var(--red-soft)}
.pline.ko .pn{background:var(--red)}
.pempty{color:var(--muted);font-size:.9rem;font-style:italic;padding:8px}
.blanks pre{line-height:2.1}
.blank{font-family:var(--f-mono);font-size:16px;font-weight:700;border:2px solid var(--violet);border-radius:8px;background:var(--violet-soft);color:var(--ink);padding:1px 6px;margin:0 2px;outline:none;max-width:12em}
.blank:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--violet) 25%,transparent)}
.blank.ok{border-color:var(--green);background:var(--green-soft)}
.blank.ko{border-color:var(--red);background:var(--red-soft)}
</style>

    { t: "code", code: `import re
from collections import defaultdict
from datetime import datetime

MOTIF = re.compile(r"^(\\S+ \\S+) sshd (FAIL|OK) user=(\\w+) ip=([\\d.]+)$")


class Sentinelle:
    def __init__(self, seuil=3, fenetre=60):
        self.seuil = seuil            # nombre d'échecs
        self.fenetre = fenetre        # en secondes
        self.echecs = defaultdict(list)
        self.comptes = defaultdict(set)

    def lire(self, journal):
        for ligne in journal.strip().splitlines():
            m = MOTIF.match(ligne.strip())
            if not m:
                continue
            quand, statut, user, ip = m.groups()
            if statut == "FAIL":
                t = datetime.strptime(quand, "%Y-%m-%d %H:%M:%S")
                self.echecs[ip].append(t)
                self.comptes[ip].add(user)

    def rafale(self, instants):
        instants = sorted(instants)
        for i in range(len(instants) - self.seuil + 1):
            duree = (instants[i + self.seuil - 1] - instants[i]).total_seconds()
            if duree <= self.fenetre:
                return True
        return False

    def rapport(self):
        print(f"Règle : {self.seuil} échecs en {self.fenetre} s")
        for ip in sorted(self.echecs):
            etat = "BLOQUER" if self.rafale(self.echecs[ip]) else "surveiller"
            comptes = ", ".join(sorted(self.comptes[ip]))
            print(f"{ip:<15} {len(self.echecs[ip])} échec(s)  {etat:<10} comptes : {comptes}")

    solution: `import re
from collections import defaultdict
from datetime import datetime

MOTIF = re.compile(r"^(\\S+ \\S+) sshd (FAIL|OK) user=(\\w+) ip=([\\d.]+)$")


class Sentinelle:
    def __init__(self, seuil=3, fenetre=60):
        self.seuil = seuil
        self.fenetre = fenetre
        self.echecs = defaultdict(list)
        self.comptes = defaultdict(set)

    def lire(self, journal):
        for ligne in journal.strip().splitlines():
            m = MOTIF.match(ligne.strip())
            if not m:
                continue
            quand, statut, user, ip = m.groups()
            if statut == "FAIL":
                t = datetime.strptime(quand, "%Y-%m-%d %H:%M:%S")
                self.echecs[ip].append(t)
                self.comptes[ip].add(user)

    def rafale(self, instants):
        instants = sorted(instants)
        for i in range(len(instants) - self.seuil + 1):
            if (instants[i + self.seuil - 1] - instants[i]).total_seconds() <= self.fenetre:
                return True
        return False

    def a_bloquer(self):
        return sorted(ip for ip in self.echecs if self.rafale(self.echecs[ip]))

    def comptes_vises(self):
        tous = set()
        for comptes in self.comptes.values():
            tous |= comptes
        return tous

(function () {
"use strict";

/* ---------- Utilitaires ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function ic(name, cls) {
  const body = (window.DP_ICONS && window.DP_ICONS[name]) || "";
  return `<svg class="lucide${cls ? " " + cls : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let toastTimer = null;
function toast(html, icon) {
  const t = $("#toast");
  t.innerHTML = (icon ? ic(icon) : "") + "<span>" + html + "</span>";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function copyText(text) {
  try {
    navigator.clipboard.writeText(text).then(() => toast("Code copié", "copy"), () => toast("Copie impossible ici : sélectionne le texte à la main", "info"));
  } catch (e) { toast("Copie impossible ici : sélectionne le texte à la main", "info"); }
}
const LEVEL_OF = (n) => LEVELS.find((l) => l.n === n);
const tint = (c) => "t-" + c;

/* ---------- Coloration syntaxique ---------- */
const KW = new Set("and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case".split(" "));
const CONST = new Set(["True", "False", "None"]);
const BI = new Set("print input len range int float str bool list dict set tuple type sum min max sorted enumerate zip abs round open help dir isinstance map filter any all reversed super repr chr ord divmod pow hasattr getattr setattr vars id hash iter next format".split(" "));
const TOK = /(#[^\n]*)|((?:[rRbBfFuU]{1,2})?(?:"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?))|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?\b|\.\d+\b)|([A-Za-z_\u00C0-\u024F][\w\u00C0-\u024F]*)|([+\-*/%=<>!&|^~:]+)|(\s+|.)/g;
function hl(code) {
  let out = "", m, prev = "";
  TOK.lastIndex = 0;
  while ((m = TOK.exec(code)) !== null) {
    if (m[0] === "") { TOK.lastIndex++; continue; }
    const t = esc(m[0]);
    if (m[1]) out += `<span class="tk-com">${t}</span>`;
    else if (m[2]) out += `<span class="tk-str">${t}</span>`;
    else if (m[3]) out += `<span class="tk-num">${t}</span>`;
    else if (m[4]) {
      const w = m[0];
      if (KW.has(w)) out += `<span class="tk-kw">${t}</span>`;
      else if (CONST.has(w)) out += `<span class="tk-const">${t}</span>`;
      else if (prev === "def" || prev === "class") out += `<span class="tk-fn">${t}</span>`;
      else if (w === "self") out += `<span class="tk-self">${t}</span>`;
      else if (BI.has(w)) out += `<span class="tk-bi">${t}</span>`;
      else out += t;
      prev = w;
      continue;
    }
    else if (m[5]) out += `<span class="tk-op">${t}</span>`;
    else out += t;
    if (!/^\s+$/.test(m[0])) prev = m[0];
  }
  return out;
}

class Editor {
  constructor(host, opts) {
    this.opts = Object.assign({ value: "", minLines: 6, maxHeight: 520, onChange: null, onRun: null, keys: true, id: "" }, opts || {});
    host.innerHTML = `
      <div class="editor">
        <div class="ed-gutter"><div class="ed-gutter-in"></div></div>
        <div class="ed-area">
          <div class="ed-layer"><div class="ed-band" hidden></div><pre class="ed-hl"></pre></div>
          <textarea class="ed-input" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Éditeur de code Python" ${this.opts.id ? `id="${this.opts.id}"` : ""}></textarea>
        </div>
      </div>
      ${this.opts.keys ? `<div class="keys" aria-label="Touches rapides">
        <button type="button" class="wide" data-k="tab">Tab ⇥</button>
        ${[":", "(", ")", "\"", "'", "=", "[", "]", "{", "}", "#", "_", "+", "-", "*", "/", "<", ">", ",", "."].map((k) => `<button type="button" data-k="${esc(k)}">${esc(k)}</button>`).join("")}
        <button type="button" class="wide" data-k="untab">⇤ Retrait</button>
      </div>` : ""}`;
    this.root = $(".editor", host);
    this.ta = $(".ed-input", host);
    this.pre = $(".ed-hl", host);
    this.layer = $(".ed-layer", host);
    this.band = $(".ed-band", host);
    this.gutter = $(".ed-gutter-in", host);
    this.marks = {};
    this.ta.value = this.opts.value;
    this.ta.addEventListener("input", () => { this.clearMarks(); this.render(); if (this.opts.onChange) this.opts.onChange(this.ta.value); });
    this.ta.addEventListener("scroll", () => this.sync());
    this.ta.addEventListener("keydown", (e) => this.key(e));
    $$(".keys button", host).forEach((b) => {
      b.addEventListener("pointerdown", (e) => e.preventDefault());
      b.addEventListener("click", () => {
        const k = b.dataset.k;
        this.ta.focus();
        if (k === "tab") this.indent(false);
        else if (k === "untab") this.indent(true);
        else this.insert(k);
      });
    });
    this.render();
  }
  get value() { return this.ta.value; }
  set value(v) { this.ta.value = v; this.clearMarks(); this.render(); this.ta.scrollTop = 0; this.ta.scrollLeft = 0; this.sync(); }
  insert(text) {
    const ta = this.ta;
    ta.focus();
    let ok = false;
    try { ok = document.execCommand("insertText", false, text); } catch (e) { ok = false; }
    if (!ok) {
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.setRangeText(text, s, en, "end");
      ta.dispatchEvent(new Event("input"));
    }
  }
  indent(out) {
    const ta = this.ta, v = ta.value;
    const s = ta.selectionStart, e = ta.selectionEnd;
    const ls = v.lastIndexOf("\n", s - 1) + 1;
    if (!out && s === e) { this.insert("    "); return; }
    const le = v.indexOf("\n", e - (e > s && v[e - 1] === "\n" ? 1 : 0));
    const end = le === -1 ? v.length : le;
    const block = v.slice(ls, end);
    const lines = block.split("\n");
    const nl = lines.map((l) => out ? l.replace(/^ {1,4}/, "") : "    " + l).join("\n");
    ta.setSelectionRange(ls, end);
    this.insert(nl);
    ta.setSelectionRange(ls, ls + nl.length);
  }
  key(e) {
    const ta = this.ta;
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); if (this.opts.onRun) this.opts.onRun(); return; }
    if (e.key === "Tab") { e.preventDefault(); this.indent(e.shiftKey); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.altKey) {
      const v = ta.value, s = ta.selectionStart;
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const line = v.slice(ls, s);
      let ind = (line.match(/^[ \t]*/) || [""])[0];
      if (/:\s*(#.*)?$/.test(line)) ind += "    ";
      if (/^\s*(return|pass|break|continue|raise)\b/.test(line) && ind.length >= 4) ind = ind.slice(4);
      e.preventDefault();
      this.insert("\n" + ind);
      return;
    }
    if (e.key === "Backspace" && ta.selectionStart === ta.selectionEnd) {
      const v = ta.value, s = ta.selectionStart;
      const ls = v.lastIndexOf("\n", s - 1) + 1;
      const before = v.slice(ls, s);
      if (before.length && /^ +$/.test(before)) {
        const n = before.length % 4 === 0 ? 4 : before.length % 4;
        e.preventDefault();
        ta.setSelectionRange(s - n, s);
        this.insert("");
      }
    }
  }
  render() {
    const v = this.ta.value;
    this.pre.innerHTML = hl(v) + "\n";
    const n = Math.max(v.split("\n").length, 1);
    let g = "";
    for (let i = 1; i <= n; i++) g += `<div class="${this.marks[i] || ""}">${i}</div>`;
    this.gutter.innerHTML = g;
    const lh = parseFloat(getComputedStyle(this.ta).lineHeight) || 24;
    const lines = Math.max(n, this.opts.minLines);
    const h = Math.min(lines * lh + 30, this.opts.maxHeight);
    this.root.style.height = h + "px";
    this.sync();
  }
  sync() {
    const x = this.ta.scrollLeft, y = this.ta.scrollTop;
    this.layer.style.transform = `translate(${-x}px, ${-y}px)`;
    this.gutter.style.transform = `translateY(${-y}px)`;
  }
  mark(line, kind, scroll) {
    this.clearMarks(true);
    if (!line) { this.render(); return; }
    this.marks[line] = kind;
    const lh = parseFloat(getComputedStyle(this.ta).lineHeight) || 24;
    this.band.hidden = false;
    this.band.className = "ed-band " + kind;
    this.band.style.top = (14 + (line - 1) * lh) + "px";
    this.render();
    if (scroll) {
      const top = (line - 1) * lh;
      const viewH = this.ta.clientHeight;
      if (top < this.ta.scrollTop || top > this.ta.scrollTop + viewH - lh * 2) this.ta.scrollTop = Math.max(0, top - viewH / 3);
      this.sync();
    }
  }
  clearMarks(silent) {
    if (!Object.keys(this.marks).length && this.band.hidden) return;
    this.marks = {};
    this.band.hidden = true;
    if (!silent) this.render();
  }
  focus() { this.ta.focus(); }
}

function diagnose(r) {
  const d = DIAG[r.etype] || { name: r.etype, icon: "stethoscope", what: "Python a rencontré un problème pendant l'exécution.", fix: ["Lis la dernière ligne du message complet : elle donne le type et la raison"] };
  let spec = "";
  for (const [re, fn] of DIAG_SPECIFIC) { const m = String(r.emsg || "").match(re); if (m) { spec = fn(m); break; } }

}

/* ---------- Console ---------- */
class Console {
  constructor(el, opts) {
    this.el = el;
    this.opts = Object.assign({ placeholder: "La sortie de ton programme apparaîtra ici." }, opts || {});
    this.reset();
  }
  reset() {
    this.el.innerHTML = `<span class="ph">${this.opts.placeholder}</span>`;
    this.chars = 0; this.cut = false; this.empty = true; this.last = null; this.lastCls = null;
  }
  clear() { this.el.innerHTML = ""; this.chars = 0; this.cut = false; this.empty = false; this.last = null; this.lastCls = null; }
  ensure() { if (this.empty) this.clear(); }
  write(text, cls) {
    this.ensure();
    if (this.cut) return;
    this.chars += text.length;
    if (this.chars > 120000) {
      this.cut = true;
      this.sys(ic("scissors") + " Sortie trop longue : la suite n'est plus affichée.");
      return;
    }
    cls = cls || "";
    if (this.last && this.lastCls === cls && this.last.parentNode === this.el && this.el.lastChild === this.last) {
      this.last.textContent += text;
    } else {
      const s = document.createElement("span");
      if (cls) s.className = cls;
      s.textContent = text;
      this.el.appendChild(s);
      this.last = s; this.lastCls = cls;
    }
    this.scroll();
  }
  sys(html) {
    this.ensure();
    const d = document.createElement("div");
    d.className = "o-sys";
    d.innerHTML = html;
    this.el.appendChild(d);
    this.last = null;
    this.scroll();
  }
  html(html) {
    this.ensure();
    const d = document.createElement("div");
    d.innerHTML = html;
    this.el.appendChild(d.firstElementChild || d);
    this.last = null;
    this.scroll();
  }
  scroll() { this.el.scrollTop = this.el.scrollHeight; }
  askInput() {
    this.ensure();
    return new Promise((resolve) => {
      const row = document.createElement("span");
      row.className = "inrow";
      row.innerHTML = `<input type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Ta réponse" placeholder="ta réponse"><button type="button">Valider</button>`;
      this.el.appendChild(row);
      this.last = null;
      const inp = $("input", row), btn = $("button", row);
      const done = () => {
        const v = inp.value;
        const s = document.createElement("span");
        s.className = "o-in";
        s.textContent = v + "\n";
        row.replaceWith(s);
        this.last = null;
        resolve(v);
      };
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); done(); } });
      btn.addEventListener("click", done);
      this.scroll();
      setTimeout(() => { try { inp.focus({ preventScroll: false }); } catch (e) { inp.focus(); } }, 30);
    });
  }
  error(r) {
    const d = diagnose(r);
    const where = r.line ? `à la <b>ligne ${r.line}</b>` : "";
    this.html(`<div class="diag">
      <div class="diag-head"><span class="tile">${ic(d.icon)}</span><div><div class="lbl">Diagnostic du Docteur</div><b>${esc(r.etype)} : ${esc(d.name)} ${where ? "· " + where : ""}</b></div></div>
      <div class="diag-body">
        ${d.spec ? `<p><b>Ce qui se passe :</b> ${d.spec}</p>` : ""}
        <p>${d.what}</p>
        <div><div class="rx-l">${ic("pill")} Traitement</div><ul>${d.fix.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>
        <details><summary>Voir le message complet de Python</summary><pre>${esc(r.tb || (r.etype + ": " + r.emsg))}</pre></details>
      </div></div>`);
  }
}

/* ---------- Moteur Python ---------- */
const BRYTHON_URL = "https://cdn.jsdelivr.net/npm/brython@3.13.1/";

  kind: null, state: "idle", version: "", worker: null, pending: null, ids: 0, statusFns: [], waiters: [], readyTimer: null, pct: 0,

  emit(state, text, pct) {

    this.statusFns.forEach((f) => f(this));
    if (state === "ready" || state === "fallback") { const w = this.waiters; this.waiters = []; w.forEach((x) => x.res()); }
    if (state === "error") { const w = this.waiters; this.waiters = []; w.forEach((x) => x.rej(new Error(text))); }
  },
  whenReady() {
    if (this.state === "ready" || this.state === "fallback") return Promise.resolve();

  },
  start() {
    if (this.forceBrython) { this.startBrython("forcé"); return; }
    let w;
    try { w = new Worker("py-worker.js"); }
    catch (e) { this.startBrython(String(e.message || e)); return; }
    this.worker = w; this.kind = "pyodide";
    this.emit("loading", "Python se prépare…", 5);
    w.onmessage = (ev) => this.onMsg(ev.data);
    w.onerror = (ev) => { if (this.worker === w) { try { ev.preventDefault(); } catch (e) {} this.fail("worker " + (ev.message || "")); } };

    this.readyTimer = setTimeout(() => { if (this.state === "loading" && this.worker === w) this.fail("délai dépassé"); }, 150000);
  },
  fail(reason) {

    if (this.pending) { this.pending.resolve({ ok: false, stopped: true }); this.pending = null; }
    this.startBrython(reason);
  },
  onMsg(m) {
    if (m.type === "status") this.emit("loading", m.text, m.pct);
    else if (m.type === "ready") { clearTimeout(this.readyTimer); this.version = m.version; this.emit("ready", "Python " + m.version + " prêt", 100); }
    else if (m.type === "fatal") { clearTimeout(this.readyTimer); this.fail(m.error); }
    else if (m.type === "out") { if (this.pending) this.pending.sink.write(m.text, m.err ? "o-err" : ""); }
    else if (m.type === "input") {
      if (!this.pending) return;
      const p = this.pending;
      p.waiting = true;
      p.sink.askInput(m.prompt).then((v) => { p.waiting = false; if (this.pending === p && this.worker) this.worker.postMessage({ type: "input", value: v }); });

  async run(opts, sink) {
    await this.whenReady();

      this.pending = { id, resolve, sink, started: performance.now() };

  },
  stop() {

  },
  resetRepl() { if (this.kind === "pyodide" && this.worker && this.state === "ready") this.worker.postMessage({ type: "reset-repl" }); else if (this.kind === "brython") this.brReset = true; },
  /* --- Mode simplifié (Brython) --- */
  loadScript(src) {
    return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("chargement " + src)); document.head.appendChild(s); });
  },
  async startBrython(reason) {
    this.kind = "brython";
    this.reason = reason;
    this.emit("loading", "Mode simplifié : chargement…", 30);
    try {
      await this.loadScript(BRYTHON_URL + "brython.min.js");
      this.emit("loading", "Mode simplifié : bibliothèques…", 60);
      await this.loadScript(BRYTHON_URL + "brython_stdlib.js");

    }
  },
  runBrython(opts, sink) {
    return new Promise((resolve) => {
      const go = (inputs) => {

      const box = document.createElement("div");
      box.innerHTML = `<textarea rows="3" style="width:100%;font-family:var(--f-mono);font-size:16px;border:2px solid var(--blue);border-radius:10px;padding:8px;background:var(--blue-soft);margin:6px 0"></textarea><button type="button" class="btn sm primary">${ic("play")} Lancer avec ces réponses</button>`;
      sink.el.appendChild(box);

const BR_HARNESS = `
from browser import window
import sys, builtins, traceback, json
_dp = window.__dp
_buf = []
class _W:
    def __init__(self, err):
        self.err = err
    def write(self, s):
        s = str(s)
        if not self.err:
            _buf.append(s)
        _dp.out(s, self.err)
        return len(s)
    def flush(self):
        pass
_oo, _oe = sys.stdout, sys.stderr
sys.stdout = _W(False)
sys.stderr = _W(True)
_q = [str(x) for x in _dp.inputs]
def _input(prompt=""):
    v = _q.pop(0) if _q else ""
    sys.stdout.write(str(prompt) + v + "\\n")
    return v
_oi = builtins.input
builtins.input = _input
_res = {"ok": True}
if _dp.mode == "repl":
    if _dp.reset or getattr(builtins, "_dp_repl_ns", None) is None:
        builtins._dp_repl_ns = {"__name__": "__main__"}
    _ns = builtins._dp_repl_ns
else:
    _ns = {"__name__": "__main__"}
_ns["input"] = _input
try:
    if _dp.mode == "repl":
        try:
            _c = compile(_dp.src, "<console>", "eval")
        except SyntaxError:
            _c = None
        if _c is not None:
            _v = eval(_c, _ns)
            if _v is not None:
                print(repr(_v))
        else:
            exec(_dp.src, _ns)
    else:
        exec(_dp.src, _ns)
except SystemExit:
    pass
except BaseException as e:
    tb = traceback.format_exc()
    _i = tb.find('File "<string>"')
    if _i != -1:
        tb = "Traceback (most recent call last):\n  " + tb[_i:]
    import re
    m = re.findall(r"line (\\d+)", tb)
    _res = {"ok": False, "etype": type(e).__name__, "emsg": str(e), "tb": tb, "line": int(m[-1]) if m else None}
if _dp.check and _res["ok"]:
    out = "".join(_buf)
    cns = dict(_ns)
    cns["__out__"] = out
    cns["__lignes__"] = out.strip().splitlines()
    cns["__source__"] = _dp.src
    def verifie(c, msg="Ce n'est pas encore tout à fait ça."):
        if not c:
            raise AssertionError(msg)
    cns["verifie"] = verifie
    try:
        exec(_dp.check, cns)
        _res["check"] = {"ok": True}
    except AssertionError as e:
        _res["check"] = {"ok": False, "msg": str(e)}
    except BaseException as e:
        _res["check"] = {"ok": False, "msg": "Il manque quelque chose : " + type(e).__name__ + " : " + str(e)}

builtins.input = _oi

`;

/* Exécute du code dans une console, gère le statut et le diagnostic */
const Runner = {
  busy: false, current: null, listeners: [],
  onBusy(fn) { this.listeners.push(fn); },
  setBusy(b) { this.busy = b; this.listeners.forEach((f) => f(b)); },
  async exec(code, con, opts) {
    opts = opts || {};
    if (this.busy) { toast("Un programme est déjà en cours : arrête-le d'abord", "hourglass"); return null; }
    this.setBusy(true);
    con.clear();
    const bar = opts.bar;
    const setBar = (cls, html) => { if (bar) { bar.innerHTML = `<span class="st ${cls}">${html}</span>`; } };
    if (Engine.state !== "ready" && Engine.state !== "fallback") {
      setBar("run", `<span class="spin"></span> Python se prépare…`);
      con.sys(`<span class="spin"></span> Python termine son installation, ton code va démarrer…`);
    }
    let t0;
    let r;
    try {
      await Engine.whenReady();
      con.clear();
      setBar("run", `<span class="spin"></span> Exécution…`);
      t0 = performance.now();
      r = await Engine.run({ code, check: opts.check, mode: opts.mode, inputs: opts.inputs }, con);
    } catch (e) {
      r = { ok: false, unavailable: true };
    }
    this.setBusy(false);
    const dt = t0 ? ((performance.now() - t0) / 1000).toFixed(2).replace(".", ",") : "0";
    if (r.unavailable) {
      setBar("ko", ic("circle-x") + " Python indisponible");
      con.sys(ic("triangle-alert") + " Python n'a pas pu démarrer dans ce navigateur. Recharge la page pour réessayer.");
    } else if (r.stopped) {
      setBar("ko", ic("square") + " Programme arrêté");
      con.sys(ic("square") + " Programme arrêté. Python redémarre…");
    } else if (!r.ok) {
      setBar("ko", ic("circle-x") + ` Erreur${r.line ? " ligne " + r.line : ""}`);
      con.error(r);
    } else {
      if (con.empty) con.sys(ic("info") + " Le programme s'est exécuté sans rien afficher. Pour voir une valeur, utilise print().");
      if (r.limit) con.sys(ic("info") + " Radiographie limitée aux 600 premières étapes.");
      setBar("ok", ic("circle-check") + ` Terminé en ${dt} s`);
    }
    return r;
  }
};

/* ---------- Progression ---------- */
const P = {
  data: store.get("dp.progress.v1", { lessons: {}, xp: 0, days: [], last: null }),
  save() { store.set("dp.progress.v1", this.data); },
  L(id) { if (!this.data.lessons[id]) this.data.lessons[id] = { quiz: {}, predict: null, ex: false, done: false }; return this.data.lessons[id]; },
  addXp(n) { this.data.xp += n; this.touch(); this.save(); },
  touch() {
    const d = new Date(); const k = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    if (!this.data.days.includes(k)) { this.data.days.push(k); if (this.data.days.length > 400) this.data.days.shift(); }
  },
  streak() {
    const set = new Set(this.data.days); let n = 0; const d = new Date();
    const key = (x) => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
    if (!set.has(key(d))) d.setDate(d.getDate() - 1);
    while (set.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  },
  doneCount() { return LESSONS.filter((l) => this.L(l.id).done).length; },
  exCount() { return LESSONS.filter((l) => this.L(l.id).ex).length; },
  status(l) {
    const s = this.L(l.id);
    if (s.done) return "done";
    if (s.predict !== null || Object.keys(s.quiz).length || s.ex || s.visited) return "doing";
    return "todo";
  },
  next() { return LESSONS.find((l) => !this.L(l.id).done) || LESSONS[LESSONS.length - 1]; },
  complete(id) {
    const s = this.L(id);
    if (!s.done) { s.done = true; this.addXp(20); return true; }
    this.save(); return false;
  }
};

    <div class="card panel xray" id="xray" hidden>

      </div>
      <div class="panel-body">
        <div class="xray-ctl">
          <button class="btn sm" id="xr-first" title="Début">${ic("skip-back")}</button>
          <button class="btn sm" id="xr-prev">${ic("step-back")} Précédent</button>

          <input type="range" id="xr-range" min="0" max="0" value="0" aria-label="Étape">

          <div><div class="eyebrow" style="margin-bottom:8px">Mémoire (variables)</div><div class="frames" id="xr-frames"></div></div>

      </div>

    $("#lab-run").onclick = () => this.run();

    $$("[data-ex]", v).forEach((b) => b.onclick = () => { this.load(EXAMPLES[+b.dataset.ex].code); toast("Exemple chargé : " + EXAMPLES[+b.dataset.ex].name, "file-code-2"); });
    $("#xr-close").onclick = () => this.closeXray();
    $("#xr-first").onclick = () => this.step(0);
    $("#xr-prev").onclick = () => this.step(this.si - 1);

    $("#xr-last").onclick = () => this.step(this.steps.length - 1);

    const hist = []; let hi = 0;
    const replRun = async () => {
      const inp = $("#repl-in"), code = inp.value;
      if (!code.trim()) return;
      hist.push(code); hi = hist.length;
      inp.value = "";
      if (Runner.busy) { toast("Un programme est déjà en cours", "hourglass"); return; }
      Runner.setBusy(true);
      let r;
      try { await Engine.whenReady(); r = await Engine.run({ code, mode: "repl" }, this.replSink()); }
      catch (e) { r = { ok: false, etype: "ErreurInterne", emsg: "Python indisponible", tb: "" }; }
      Runner.setBusy(false);
      if (r && !r.ok && !r.stopped) {
        const d = diagnose(r);
        this.repl.write(`${r.etype} : ${d.name}${d.spec ? "\n  " + d.spec.replace(/<[^>]+>/g, "") : ""}\n`, "o-err");
      }
      if (r && r.stopped) this.repl.sys("Arrêté.");
    };
    this.replCmd = (code) => { this.repl.write(">>> " + code + "\n", "r-cmd"); };
    $("#repl-go").onclick = () => { this.replCmd($("#repl-in").value); replRun(); };
    $("#repl-in").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); if ($("#repl-in").value.trim()) { this.replCmd($("#repl-in").value); replRun(); } }
      else if (e.key === "ArrowUp") { if (hi > 0) { hi--; $("#repl-in").value = hist[hi]; e.preventDefault(); } }
      else if (e.key === "ArrowDown") { if (hi < hist.length - 1) { hi++; $("#repl-in").value = hist[hi]; } else { hi = hist.length; $("#repl-in").value = ""; } e.preventDefault(); }
    });
    $("#repl-reset").onclick = () => { Engine.resetRepl(); this.repl.reset(); toast("Console interactive réinitialisée", "rotate-ccw"); };
    Runner.onBusy((b) => { $("#lab-stop").hidden = !b; $("#lab-run").disabled = b; $("#lab-xray").disabled = b; });

  replSink() { const c = this.repl; return { write: (t, cls) => c.write(t, cls), askInput: (p) => c.askInput(p), html: (h) => c.html(h), el: c.el, sys: (h) => c.sys(h) }; },
  show() { this.init(); },
  load(code) { this.init(); this.closeXray(); this.ed.value = code; store.set("dp.lab.code", code); },
  async run() {
    this.closeXray();
    this.ed.clearMarks();
    const r = await Runner.exec(this.ed.value, this.con, { bar: $("#lab-bar") });
    if (r && !r.ok && r.line) this.ed.mark(r.line, "err", true);
  },
  async xray() {
    this.init();
    this.closeXray();
    this.ed.clearMarks();
    if (Engine.kind === "brython") { toast("La Radiographie n'est pas disponible en mode simplifié", "info"); return; }
    const r = await Runner.exec(this.ed.value, this.con, { bar: $("#lab-bar"), mode: "trace" });
    if (!r || r.stopped || r.unavailable) return;
    this.steps = (r.steps || []).filter((s) => s.event !== "exception");
    this.full = r.fullout || "";
    this.err = r.ok ? null : r;
    if (!this.steps.length) { if (r.ok) toast("Rien à radiographier : le programme est vide ?", "info"); else if (r.line) this.ed.mark(r.line, "err", true); return; }
    $("#xray").hidden = false;
    $("#xr-range").max = this.steps.length - 1;
    this.step(0);
    setTimeout(() => $("#xray").scrollIntoView({ behavior: "smooth", block: "start" }), 50);
  },
  closeXray() { if (!this.inited) return; this.steps = null; $("#xray").hidden = true; this.ed.clearMarks(); },
  step(i) {
    if (!this.steps) return;
    i = Math.max(0, Math.min(this.steps.length - 1, i));
    this.si = i;
    const st = this.steps[i], prev = this.steps[i - 1];
    $("#xr-range").value = i;
    $("#xr-step").textContent = `Étape ${i + 1} / ${this.steps.length}`;
    this.ed.mark(st.line, "cur", true);
    const lineTxt = (this.ed.value.split("\n")[st.line - 1] || "").trim();
    let info;
    if (st.event === "return") info = `${ic("corner-down-left")} <span>La fonction <b>${esc(st.stack[st.stack.length - 1].name)}</b> se termine et renvoie <code>${esc(st.ret)}</code></span>`;
    else info = `${ic("arrow-right")} <span>Ligne <b>${st.line}</b> va s'exécuter : <code>${esc(lineTxt)}</code></span>`;
    const last = i === this.steps.length - 1;
    if (last && this.err) info += ` <span class="pill" style="background:var(--red-soft);color:var(--red-ink);border:0">${ic("circle-x")} ${esc(this.err.etype)} ici</span>`;
    else if (last) info += ` <span class="pill done">${ic("flag")} Fin du programme</span>`;
    $("#xr-info").innerHTML = info;
    const prevVals = {};
    if (prev) prev.stack.forEach((f, k) => f.vars.forEach((v) => { prevVals[k + ":" + f.name + ":" + v[0]] = v[1]; }));
    $("#xr-frames").innerHTML = st.stack.map((f, k) => `<div class="frame ${k === st.stack.length - 1 ? "active" : ""}"><div class="fn">${ic(k === 0 ? "file-code-2" : "cog")} ${esc(f.name)}</div><div class="fv">${f.vars.length ? f.vars.map((v) => varBox(v[0], v[1], v[2], prev && prevVals[k + ":" + f.name + ":" + v[0]] !== v[1])).join("") : `<span class="empty">Aucune variable pour l'instant</span>`}</div></div>`).join("");
    this.xout.clear();
    const o = this.full.slice(0, st.out);
    if (o) this.xout.write(o); else this.xout.reset();
    $("#xr-prev").disabled = i === 0; $("#xr-first").disabled = i === 0;
    $("#xr-next").disabled = last; $("#xr-last").disabled = last;
  }
};

/* ---------- Révision espacée (boîtes de Leitner) ---------- */
const SRS_DAYS = [1, 3, 7, 16, 35];
const dayKey = (d) => { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const addDays = (n) => { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return dayKey(d); };
const SRS = {
  all() { if (!P.data.srs) P.data.srs = {}; return P.data.srs; },
  first(key, ok) {
    const all = this.all();
    if (all[key]) return;
    const box = ok ? 1 : 0;
    all[key] = { box, due: addDays(SRS_DAYS[box]) };
    P.save();
  },
  review(key, ok) {
    const all = this.all();
    const c = all[key] || { box: 0 };
    c.box = ok ? Math.min(c.box + 1, SRS_DAYS.length - 1) : 0;
    c.due = addDays(SRS_DAYS[c.box]);
    all[key] = c;
    P.save();
  },
  due() {
    const today = dayKey();
    return Object.entries(this.all()).filter(([k, c]) => c.due <= today && cardData(k)).map(([k]) => k);
  },
  mastered() { return Object.values(this.all()).filter((c) => c.box >= 3).length; }
};
function cardData(key) {
  const [lid, kind, idx] = key.split("|");
  const l = LESSONS.find((x) => x.id === lid);
  if (!l) return null;
  if (kind === "q") {
    const q = l.quiz[+idx];
    if (!q) return null;
    return { lesson: l, q: q.q, code: null, options: q.o, answer: q.a, explain: q.e, html: true };
  }
  if (kind === "p") {
    const b = l.blocks[+idx];
    if (!b || b.t !== "predict") return null;
    return { lesson: l, q: "Que va afficher ce programme ?", code: b.code, options: b.options.map(esc), answer: b.answer, explain: b.explain, html: true };
  }
  return null;
}

const PTYPES = {
  parsons: { name: "Remettre dans l'ordre", icon: "arrow-down-up", color: "blue", hint: "Touche les lignes dans le bon ordre" },
  bug: { name: "Chasse au bug", icon: "bug", color: "red", hint: "Trouve l'erreur et soigne le code" },
  blanks: { name: "Code à trous", icon: "text-cursor-input", color: "violet", hint: "Complète les morceaux manquants" }
};
function seededShuffle(arr, seed) {
  let h = 2166136261;
  for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; };
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((x, i) => x === arr[i]) && a.length > 1) a.push(a.shift());
  return a;
}
function practiceDone(id) { return !!(P.data.practice && P.data.practice[id]); }
function practiceSuccess(item, host) {
  if (!P.data.practice) P.data.practice = {};
  const first = !P.data.practice[item.id];
  P.data.practice[item.id] = true;
  let bonus = first ? 10 : 0;
  const today = dayKey();
  if (!P.data.daily) P.data.daily = {};
  const isDaily = dailyItem() && dailyItem().id === item.id && !P.data.daily[today];
  if (isDaily) { P.data.daily[today] = true; bonus += 15; }
  if (bonus) P.addXp(bonus); else P.save();
  $(".pv", host).innerHTML = `<div class="verdict t-green"><span class="tile">${ic("heart-pulse")}</span><div><b>${isDaily ? "Défi du jour réussi !" : "Bien soigné !"}</b><p>${bonus ? "+" + bonus + " XP" : "Déjà réussi, mais c'est en répétant qu'on retient."}</p></div></div>`;
  const badge = $(".pdone", host); if (badge) badge.hidden = false;
  if (bonus) toast("+" + bonus + " XP", "star");
}
function practiceFail(host, msg) {
  $(".pv", host).innerHTML = `<div class="verdict t-orange"><span class="tile">${ic("stethoscope")}</span><div><b>Pas encore</b><p>${msg}</p></div></div>`;
}
function renderPracticeItem(item, host) {
  const T = PTYPES[item.type], l = LESSONS.find((x) => x.id === item.lesson);

      $$("[data-add]", zone).forEach((b) => b.onclick = () => { placed.push(+b.dataset.add); draw(); });

      };
    };
    draw();
  } else if (item.type === "blanks") {
    let n = 0;

    const fill = () => { let k = 0; return parts.map((p, i) => p + (i < parts.length - 1 ? ($$(".blank", zone)[k++].value.trim() || "___") : "")).join(""); };
    $(".prun", zone).onclick = () => runCode(fill());
    $(".psol", zone).onclick = () => { $$(".blank", zone).forEach((inp, i) => { inp.value = item.answers[i][0]; inp.classList.remove("ko"); }); };
    $(".pchk", zone).onclick = () => {
      let ok = true;

        if (!good) ok = false;
      });
      if (ok) practiceSuccess(item, host);

    };

    $(".prst", zone).onclick = () => { ed.value = item.code; $(".pv", host).innerHTML = ""; };
    $(".psol", zone).onclick = () => { ed.value = item.solution; toast("Solution chargée : compare-la avec le code de départ", "eye"); };

function dailyItem() {
  const visited = new Set(Object.entries(P.data.lessons).filter(([, s]) => s.visited || s.done).map(([k]) => k));
  let pool = PRACTICE.filter((x) => visited.has(x.lesson));
  if (!pool.length) pool = PRACTICE.filter((x) => ["premier-programme", "variables", "types"].includes(x.lesson));
  const k = dayKey();
  let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return pool[h % pool.length];
}

function renderReview() {

    const el = $("#engine");
    el.className = "engine " + E.state;
    if (E.state === "loading") el.innerHTML = `<span class="dot"></span><span><span class="lbl-long">${esc(E.text)} </span></span><span class="bar"><i style="width:${E.pct || 5}%"></i></span>`;
    else if (E.state === "ready") el.innerHTML = `<span class="dot"></span><span>Python ${esc(E.version)}<span class="lbl-long"> prêt</span></span>`;
    else if (E.state === "fallback") el.innerHTML = `<span class="dot"></span><span>Mode simplifié</span>`;
    else if (E.state === "error") el.innerHTML = `<span class="dot"></span><span>Python indisponible</span>`;
    else el.innerHTML = `<span class="dot"></span><span>Python</span>`;
    el.title = E.state === "fallback" ? "Le moteur principal n'a pas pu démarrer. Le mode simplifié fonctionne, sans Radiographie, et input() lit des réponses préparées." : "";
  });
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-nav],[data-nav-go],[data-open],[data-scroll]");
    if (!t) return;
    if (t.dataset.nav) go(t.dataset.nav);
    else if (t.dataset.navGo) go(t.dataset.navGo);
    else if (t.dataset.open) go("lesson", t.dataset.open);
    else if (t.dataset.scroll) { const el = document.getElementById(t.dataset.scroll); if (el) { const y = el.getBoundingClientRect().top + window.scrollY - 140; window.scrollTo({ top: y, behavior: "smooth" }); } }
  });
  const h = (location.hash || "").slice(1);
  if (h.startsWith("lecon-") && LESSONS.find((l) => l.id === h.slice(6))) go("lesson", h.slice(6), true);
  else if (h === "labo") go("lab", null, true);
  else if (h === "aide") go("aide", null, true);
  else if (h === "entrainement") go("train", null, true);
  else go("home", null, true);
  try { Engine.forceBrython = /brython/.test(location.search); } catch (e) {}
  Engine.start();
  Install.init();
}
window.DP = { Engine, Lab, go, P };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>

</body>
</html>
