<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable · Prof Python</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Bricolage Grotesque";font-display:swap;font-weight:200 800;src:url(/fonts/bricolage-grotesque-latin-opsz-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-display:swap;font-weight:300 900;src:url(/fonts/figtree-latin-wght-normal.woff2) format("woff2")}
:root{--bg:#F3F5FA;--surface:#fff;--ink:#141C33;--ink-2:#47526B;--line:#E1E6F0;--blue:#2E66D6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:40px 16px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
h1,h2{font-family:"Bricolage Grotesque","Figtree",sans-serif;letter-spacing:-.02em;line-height:1.2}
h1{font-size:1.9rem;margin:0 0 8px} h2{font-size:1.2rem;margin:28px 0 6px}
p,li{color:var(--ink-2)} a{color:var(--blue);overflow-wrap:anywhere}
.back{display:inline-block;margin-bottom:20px;font-weight:600;text-decoration:none}
.btn{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:12px;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="card" style="text-align:center">
<h1>Page introuvable</h1>
<p>Le Prof a cherché partout : cette page n'existe pas (ou plus).</p>
<a class="btn" href="/">Retour à l'accueil</a>
</div>
</main>
</body>
</html>
